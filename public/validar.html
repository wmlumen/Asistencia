<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Alumno - Institución</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js?v=2"></script>
    <style>
        .glass-panel-light { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .background-blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        .blob { position: absolute; filter: blur(80px); opacity: 0.6; border-radius: 50%; }
        .blob-1 { width: 400px; height: 400px; background: #3b82f6; top: -100px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; background: #10b981; bottom: -100px; right: -100px; }
    </style>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center p-4">

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="glass-panel-light max-w-lg w-full relative z-10 overflow-hidden">
        <div class="bg-gradient-to-br from-indigo-900 to-blue-800 p-6 text-center relative overflow-hidden">
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
            <div class="relative z-10">
                <div class="flex items-center justify-between mb-2">
                    <div class="text-xs uppercase tracking-[0.3em] text-blue-200">INSTITUCIÓN</div>
                    <a href="index.html" class="text-white text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 no-underline">
                        <i class="fas fa-home text-[10px]"></i> Volver al inicio
                    </a>
                </div>
                <h1 class="text-white text-2xl font-bold tracking-tight">Validación de Alumno</h1>
                <p class="text-blue-100 text-sm mt-1">Examen - Grupo <span id="grupo-display">S026</span></p>
            </div>
        </div>
        
        <div class="p-6">
            <!-- Panel de Solicitud Extraordinaria -->
            <div id="panel-extraordinario" class="mb-6 p-4 bg-amber-50/80 backdrop-blur-sm rounded-xl border border-amber-200 shadow-sm">
                <h3 class="font-bold text-amber-800 mb-3">
                    <i class="fas fa-exclamation-triangle mr-2"></i>¿No pudiste rendir el examen?
                </h3>
                <p class="text-sm text-slate-600 mb-3">Si tienes justificativo, puedes solicitar un examen extraordinario.</p>
                <button onclick="mostrarFormularioExtraordinario()" class="text-sm text-amber-700 font-bold hover:underline transition-all">
                    <i class="fas fa-plus-circle mr-1"></i> Solicitar Examen Extraordinario
                </button>
            </div>
            
            <!-- Formulario Extraordinario (inicialmente oculto) -->
            <div id="form-extraordinario" class="hidden mb-6 p-5 bg-white/70 backdrop-blur-md rounded-2xl border border-amber-200 shadow-lg">
                <h3 class="font-bold text-amber-800 mb-4 text-lg border-b border-amber-100 pb-2">
                    <i class="fas fa-file-alt mr-2"></i>Solicitar Examen Extraordinario
                </h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Código de Solicitud (enviado por email)</label>
                        <input type="text" id="codigo-solicitud" 
                            class="w-full bg-amber-50/50 border-2 border-amber-200 rounded-xl px-4 py-3 text-center font-bold text-slate-800 focus:border-amber-500 focus:outline-none transition-all"
                            placeholder="Ej: CE-EXT-26">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Cédula de Identidad</label>
                        <input type="text" id="cedula-extra" 
                            class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 focus:border-blue-500 focus:outline-none transition-all"
                            placeholder="Tu número de cédula">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Motivo de la Solicitud</label>
                        <select id="motivo-solicitud" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 focus:border-blue-500 focus:outline-none transition-all">
                            <option value="">Selecciona un motivo...</option>
                            <option value="enfermedad">Enfermedad</option>
                            <option value="falta_pago">Falta de Pago</option>
                            <option value="trabajo">Trabajo</option>
                            <option value="familiar">Problema Familiar</option>
                            <option value="otro">Otros</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Describe tu situación</label>
                        <textarea id="descripcion-solicitud" 
                            class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-blue-500 focus:outline-none transition-all"
                            rows="3"
                            placeholder="Explica detalladamente por qué no pudiste rendir el examen..."></textarea>
                    </div>
                    
                    <div class="flex gap-3 pt-2">
                        <button onclick="enviarSolicitudExtraordinaria()" 
                            class="flex-1 bg-gradient-to-r from-amber-500 to-amber-600 text-white font-bold py-3 rounded-xl hover:from-amber-600 hover:to-amber-700 shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all">
                            <i class="fas fa-paper-plane mr-2"></i>Enviar Solicitud
                        </button>
                        <button onclick="ocultarFormularioExtraordinario()" 
                            class="bg-slate-200 text-slate-700 font-bold py-3 px-5 rounded-xl hover:bg-slate-300 shadow-sm transition-all">
                            Cancelar
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Buscador Normal -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Ingrese su Cédula de Identidad</label>
                <input type="text" id="cedula-input" 
                    class="w-full bg-white/60 border-2 border-slate-200 rounded-xl px-4 py-3 text-lg focus:border-blue-500 focus:outline-none text-center transition-all"
                    placeholder="Ej: 12345678">
            </div>
            
            <button onclick="validarAlumno()" 
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300">
                <i class="fas fa-check-circle mr-2"></i> Validar Alumno
            </button>
            
            <div id="resultado" class="mt-6 hidden">
            </div>
            
            <div class="mt-6 text-center text-xs text-slate-400">
                <p>Verifique sus datos antes de continuar</p>
            </div>
        </div>
        
        <div class="bg-white/40 backdrop-blur-sm p-4 text-center border-t border-slate-200/50">
            <a href="index.html" class="text-blue-600 font-medium text-sm hover:underline transition-all">
                <i class="fas fa-home mr-1"></i> Volver al inicio
            </a>
        </div>
    </div>

    <script>
        // Set Grupo if CONFIG is loaded
        setTimeout(() => {
            if(window.CONFIG && window.CONFIG.grupo) {
                document.getElementById('grupo-display').textContent = window.CONFIG.grupo;
            }
        }, 500);

        // Código para examen extraordinario (se carga desde CONFIG o usa valor por defecto)
        const CODIGO_EXTRAORDINARIO = 'CE-EXT-26';
        
        // Función para cargar alumnos desde el archivo CSV
        async function cargarAlumnos() {
            try {
                const response = await fetch('Listado_Alumnos.csv');
                if (!response.ok) throw new Error('No se pudo cargar');
                
                const texto = await response.text();
                const lineas = texto.split('\n');
                const alumnos = [];
                
                // Saltar la primera línea (encabezados)
                for (let i = 1; i < lineas.length; i++) {
                    const linea = lineas[i].trim();
                    if (!linea) continue;
                    
                    const partes = linea.split(',');
                    if (partes.length >= 6) {
                        // Formato: Carrera,Cédula,Apellido Nombre,Ficha,Nro Factura,Estado
                        const estado = partes[5].trim();
                        // Solo incluir los que tienen * (habilitados) para validación
                        if (estado === '*') {
                            alumnos.push({
                                carrera: partes[0].trim(),
                                cedula: partes[1].trim(),
                                nombre: partes[2].trim(),
                                factura: partes[4].trim(),
                                estado: estado
                            });
                        }
                    }
                }
                
                return alumnos;
            } catch (error) {
                console.log('No se pudo cargar CSV, usando modo limitado');
                return [];
            }
        }
        
        // Variables globales
        let listaAlumnos = [];
        
        function mostrarFormularioExtraordinario() {
            document.getElementById('form-extraordinario').classList.remove('hidden');
            document.getElementById('panel-extraordinario').classList.add('hidden');
        }
        
        function ocultarFormularioExtraordinario() {
            document.getElementById('form-extraordinario').classList.add('hidden');
            document.getElementById('panel-extraordinario').classList.remove('hidden');
            
            // Limpiar formulario
            document.getElementById('cedula-extra').value = '';
            document.getElementById('motivo-solicitud').value = '';
            document.getElementById('descripcion-solicitud').value = '';
        }
        
        function enviarSolicitudExtraordinaria() {
            const codigo = document.getElementById('codigo-solicitud').value.trim();
            const cedula = document.getElementById('cedula-extra').value.trim();
            const motivo = document.getElementById('motivo-solicitud').value;
            const descripcion = document.getElementById('descripcion-solicitud').value.trim();
            
            if (!codigo || codigo !== CODIGO_EXTRAORDINARIO) {
                alert('Código de solicitud incorrecto. Contacte al docente.');
                return;
            }
            
            if (!cedula) {
                alert('Por favor ingrese su cédula');
                return;
            }
            
            if (!motivo) {
                alert('Por favor seleccione un motivo');
                return;
            }
            
            if (!descripcion || descripcion.length < 20) {
                alert('Por favor describa su situación con más detalle (mínimo 20 caracteres)');
                return;
            }
            
            // Buscar el alumno en la lista cargada
            if (listaAlumnos.length === 0) {
                cargarAlumnos().then(res => {
                    listaAlumnos = res;
                    procesarSolicitudExtra(cedula, motivo, descripcion, codigo);
                });
            } else {
                procesarSolicitudExtra(cedula, motivo, descripcion, codigo);
            }
        }

        function procesarSolicitudExtra(cedula, motivo, descripcion, codigo) {
            const alumno = listaAlumnos.find(a => a.cedula === cedula);
            
            if (!alumno) {
                alert('Cédula no encontrada en el sistema');
                return;
            }
            
            // Crear solicitud
            const solicitud = {
                tipo: 'EXTRAORDINARIO',
                cedula: cedula,
                nombre: alumno.nombre,
                carrera: alumno.carrera,
                motivo: motivo,
                descripcion: descripcion,
                fecha: new Date().toISOString(),
                codigo: codigo
            };
            
            // Guardar en localStorage
            let solicitudes = JSON.parse(localStorage.getItem('solicitudesExtraordinarias') || '[]');
            solicitudes.push(solicitud);
            localStorage.setItem('solicitudesExtraordinarias', JSON.stringify(solicitudes));
            
            // Mostrar confirmación
            alert(`Solicitud enviada exitosamente!\n\nAlumno: ${alumno.nombre}\nCédula: ${cedula}\nMotivo: ${motivo}\n\nEl docente revisará su solicitud. Recibirá una notificación cuando sea aprobada.`);
            
            // Ocultar formulario y limpiar
            ocultarFormularioExtraordinario();
        }
        
        async function validarAlumno() {
            const cedula = document.getElementById('cedula-input').value.trim();
            const resultado = document.getElementById('resultado');
            
            if (!cedula) {
                alert('Por favor ingrese su cédula');
                return;
            }
            
            // Cargar lista si no está cargada
            if (listaAlumnos.length === 0) {
                listaAlumnos = await cargarAlumnos();
            }
            
            const alumno = listaAlumnos.find(a => a.cedula === cedula);
            
            if (!alumno) {
                resultado.className = 'mt-6 p-5 bg-white/80 backdrop-blur-md rounded-2xl border border-rose-200 shadow-sm transition-all';
                resultado.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-times-circle text-5xl text-rose-500 mb-4 drop-shadow-sm"></i>
                        <h3 class="font-bold text-xl text-rose-700">Cédula no encontrada</h3>
                        <p class="text-slate-600 mt-2 font-medium">Su cédula no está registrada en el listado de exámenes.</p>
                        <p class="text-sm text-slate-500 mt-2 p-3 bg-rose-50 rounded-lg">Contacte al docente para verificar su situación.</p>
                    </div>
                `;
                resultado.classList.remove('hidden');
                return;
            }
            
            if (alumno.estado === '*') {
                resultado.className = 'mt-6 p-5 bg-white/80 backdrop-blur-md rounded-2xl border border-emerald-200 shadow-md transition-all';
                resultado.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-check-circle text-5xl text-emerald-500 mb-4 drop-shadow-sm"></i>
                        <h3 class="font-bold text-xl text-emerald-700">¡Está habilitado para rendir!</h3>
                        <p class="text-lg font-bold text-slate-800 mt-3">${alumno.nombre}</p>
                        <div class="flex flex-col gap-1 text-sm text-slate-600 mt-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <span><strong>Carrera:</strong> ${alumno.carrera === 'IC' ? 'Ingeniería Comercial' : alumno.carrera === 'CO' ? 'Contabilidad' : alumno.carrera}</span>
                            <span><strong>Factura:</strong> ${alumno.factura}</span>
                        </div>
                        <a href="index.html" class="inline-block mt-5 w-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white px-6 py-3 rounded-xl font-bold hover:from-emerald-600 hover:to-emerald-700 shadow-md hover:-translate-y-0.5 transition-all">
                            <i class="fas fa-pencil-alt mr-2"></i> Ir al Examen
                        </a>
                    </div>
                `;
            } else if (alumno.estado === 'consulta') {
                resultado.className = 'mt-6 p-5 bg-white/80 backdrop-blur-md rounded-2xl border border-amber-200 shadow-sm transition-all';
                resultado.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-search text-5xl text-amber-500 mb-4 drop-shadow-sm"></i>
                        <h3 class="font-bold text-xl text-amber-700">Consultar Resultados</h3>
                        <p class="text-lg font-bold text-slate-800 mt-3">${alumno.nombre}</p>
                        <p class="text-sm text-slate-600 mt-2 p-3 bg-amber-50 rounded-lg border border-amber-100">No está habilitado para rendir el examen nuevamente.</p>
                        <a href="consultar.html" class="inline-block mt-5 w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white px-6 py-3 rounded-xl font-bold hover:from-amber-600 hover:to-orange-600 shadow-md hover:-translate-y-0.5 transition-all">
                            <i class="fas fa-search mr-2"></i> Consultar mis Resultados
                        </a>
                    </div>
                `;
            }
            
            resultado.classList.remove('hidden');
        }
        
        document.getElementById('cedula-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                validarAlumno();
            }
        });
        
        // Cargar lista de alumnos al iniciar
        cargarAlumnos().then(alumnos => {
            listaAlumnos = alumnos;
            console.log('Alumnos cargados:', listaAlumnos.length);
        });
    </script>

</body>
</html>
