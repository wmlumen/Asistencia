<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas de Estudio Primer Parcial - Centuria Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Inter:wght@400;600&display=swap');

        :root {
            --primary: #10b981;
            --primary-dark: #047857;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Mesh Gradient Background */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.15), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(4, 120, 87, 0.2), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(6, 78, 59, 0.2), transparent 50%);
            animation: pulseBg 15s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .font-title {
            font-family: 'Outfit', sans-serif;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }

        /* Flashcard Logic & 3D Effect */
        .card-container {
            perspective: 1500px;
            width: 100%;
            max-width: 600px;
            height: 380px;
            cursor: pointer;
            margin: 0 auto;
            position: relative;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            border-radius: 1.5rem;
            transform-style: preserve-3d;
        }

        /* Front Card */
        .card-front {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .card-front::before {
            content: "\f059"; /* Question mark icon */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 10rem;
            color: rgba(255, 255, 255, 0.02);
            z-index: 0;
            transform: rotate(15deg) translateZ(-50px);
        }

        /* Back Card */
        .card-back {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            transform: rotateY(180deg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .card-content {
            transform: translateZ(60px);
            z-index: 10;
        }

        /* Floating Animation for the Card */
        .floating {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #34d399, #059669);
            width: 0%;
            transition: width 0.5s ease-out;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        /* Custom Button Hover Effects */
        .btn-nav {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-nav::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s ease;
        }

        .btn-nav:hover::after {
            transform: translate(-50%, -50%) scale(1);
        }
        
        .answer-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
        }

        /* Responsive Tweaks for Mobile */
        @media (max-width: 768px) {
            .card-container {
                height: 320px;
            }
            .card-front, .card-back {
                padding: 1.5rem;
            }
            .card-front::before {
                font-size: 6rem;
                top: -10px;
                right: -5px;
            }
        }

    </style>
</head>

<body>
    <div class="bg-mesh"></div>

    <div class="max-w-5xl mx-auto px-4 py-12 relative z-10">

        <!-- Header -->
        <header class="text-center mb-16">
            <div class="inline-flex items-center justify-center space-x-3 mb-4">
                <span class="w-12 h-[1px] bg-emerald-500/50"></span>
                <span class="font-title font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200 tracking-widest text-sm uppercase">
                    Instituto Superior Centuria
                </span>
                <span class="w-12 h-[1px] bg-emerald-500/50"></span>
            </div>
            <h1 class="font-title text-4xl md:text-5xl lg:text-6xl font-extrabold text-white mb-4 tracking-tight">
                Primer <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-emerald-600">Parcial</span>
            </h1>
            <p class="text-lg text-slate-400 font-light max-w-2xl mx-auto">
                Unidades 1, 2 y 3: Teoría, Economía y Cultura.
            </p>
        </header>

        <!-- Main Workspace -->
        <main class="glass-panel p-6 md:p-12 mb-12">
            
            <!-- Header of Card Area -->
            <div class="flex justify-between items-center mb-4">
                <span id="card-counter" class="font-title font-bold text-slate-300 text-sm tracking-widest uppercase">
                    Tarjeta 1 de 60
                </span>
                <span class="text-xs text-emerald-400 font-mono bg-emerald-400/10 px-3 py-1 rounded-full border border-emerald-400/20">
                    <i class="fas fa-layer-group mr-1"></i> Sociología
                </span>
            </div>

            <!-- Progress -->
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <!-- Flashcard -->
            <div class="card-container floating" id="flashcard" onclick="flipCard()">
                <div class="card-inner">
                    <div class="card-front">
                        <div class="card-content">
                            <p id="question-text" class="text-2xl md:text-3xl font-title font-bold leading-tight text-white mb-2">
                                Cargando pregunta...
                            </p>
                            <p class="text-sm text-slate-400 mt-6 font-light opacity-70 animate-pulse">
                                Haz clic para revelar
                            </p>
                        </div>
                    </div>
                    <div class="card-back">
                        <div class="card-content">
                            <div class="answer-label">Respuesta Correcta</div>
                            <p id="answer-text" class="text-xl md:text-2xl font-medium leading-relaxed text-white">
                                Cargando respuesta...
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="flex items-center justify-center gap-6 mt-12">
                <button onclick="prevCard()" class="btn-nav w-14 h-14 rounded-full bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:border-emerald-500/50 flex items-center justify-center shadow-lg">
                    <i class="fas fa-chevron-left text-xl"></i>
                </button>
                <button onclick="nextCard()" class="btn-nav px-8 py-4 rounded-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-title font-bold text-lg shadow-[0_0_20px_rgba(16,185,129,0.4)] hover:shadow-[0_0_30px_rgba(16,185,129,0.6)] transform hover:-translate-y-1">
                    Siguiente Tarjeta <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
            
        </main>

        <!-- Footer -->
        <footer class="mt-16 text-center">
            <a href="index.html" class="inline-flex items-center justify-center text-slate-400 hover:text-emerald-400 font-medium transition duration-300 group">
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center mr-3 group-hover:border-emerald-500/50 group-hover:bg-slate-800/80">
                    <i class="fas fa-home"></i>
                </div>
                Volver al Dashboard Principal
            </a>
        </footer>

    </div>

    <script>
        const cardsData = [
            // UNIDAD 1: TEORÍA SOCIOLÓGICA
            { q: "¿Qué autor es considerado el padre del Positivismo y de la sociología científica?", a: "Augusto Comte." },
            { q: "¿En qué consiste la Ley de los Tres Estados de Comte?", a: "Teológico (mágico-religioso), Metafísico (filosófico-abstracto) y Positivo (científico-racional)." },
            { q: "¿Qué es la 'Estática Social' según Comte?", a: "Estudio del orden social: la familia, la cooperación y los vínculos que mantienen la cohesión social." },
            { q: "¿Qué es la 'Dinámica Social' según Comte?", a: "Estudio del progreso y transformación de la sociedad a través de las fases de la ley de los tres estados." },
            { q: "¿Cuál es la jerarquía de las ciencias según Comte?", a: "Matemáticas, Astronomía, Física, Química, Biología y Sociología (de lo más simple a lo más complejo)." },
            { q: "¿Cómo define Durkheim el 'Hecho Social'?", a: "Maneras de actuar, pensar y sentir que son externas al individuo, con poder coercitivo y generalidad en la sociedad." },
            { q: "¿Cuáles son las características del Hecho Social según Durkheim?", a: "Es externo al individuo, tiene coerción sobre él, es general en la sociedad y trasciende al individuo." },
            { q: "¿Qué es la 'Solidaridad Mecánica' en Durkheim?", a: "Solidaridad basada en la similitud entre individuos en sociedades tradicionales, con conciencia colectiva fuerte." },
            { q: "¿Qué es la 'Solidaridad Orgánica' en Durkheim?", a: "Solidaridad basada en la diferenciación e interdependencia funcional en sociedades modernas complejas." },
            { q: "¿Qué es el 'Suicidio Anómico' según Durkheim?", a: "Suicidio causedo por la falta de regulación social, donde el individuo se siente perdido ante la ausencia de normas." },
            { q: "¿Qué es el método 'Verstehen' de Max Weber?", a: "La comprensión interpretativa del sentido subjetivo que el actor da a su acción social." },
            { q: "¿Cuáles son los 4 tipos de Acción Social según Weber?", a: "Racional con fines, Racional con valores, Afectiva y Tradicional." },
            { q: "¿Qué es la 'Verstehende Soziologie' (Sociología Comprensiva)?", a: "Corriente sociológica que busca comprender e interpretar el significado de las acciones sociales desde la perspectiva del actor." },
            { q: "¿Qué es la 'Burocracia' según Weber?", a: "Organización racional basada en jerarquía, reglas impersonales, división del trabajo y documentación." },
            { q: "¿Qué es el 'Tipo Ideal' en Weber?", a: "Construcción teórica que representa los elementos esenciales de un fenómeno social para comprenderlo mejor." },
            { q: "¿Cuál es el motor de la historia para Karl Marx?", a: "La lucha de clases y el conflicto por el control de los medios de producción económica." },
            { q: "¿Qué son los 'Medios de Producción' en Marx?", a: "Recursos como tierra, fábricas, herramientas y capital necesarios para producir bienes." },
            { q: "¿Qué es la 'Plusvalía' según Marx?", a: "Diferencia entre el valor producido por el trabajador y el salario que recibe, que genera la ganancia del capitalista." },
            { q: "¿Qué es la 'Alienación' en Marx?", a: "Separación del trabajador de su producto, del proceso de trabajo, de su naturaleza humana y de los demás." },
            { q: "¿Qué es la 'Ideología' según Marx?", a: "Sistema de ideas que justifica la dominación de una clase sobre otra, ocultando la realidad del explotación." },

            // UNIDAD 2: ECONOMÍA Y PERSPECTIVA ECONÓMICA
            { q: "¿Qué es el 'Homo Economicus'?", a: "Modelo economico que asume el humano es un actor puramente racional que busca maximizar beneficios y minimizar costos." },
            { q: "¿Qué propone el modelo del 'Homo Sociologicus'?", a: "Que las decisiones económicas están influenciadas por normas sociales, valores, roles y la presión del grupo." },
            { q: "¿Qué es la 'Incrustación Social' (Embeddedness) de Polanyi?", a: "La idea de que la economía no está aislada, sino sumergida en redes de relaciones sociales, confianza y normas." },
            { q: "¿Qué es el 'Capital Social' según Putnam?", a: "Recursos como información, favores y oportunidades obtenidos a través de redes de contactos y confianza interpersonal." },
            { q: "¿Qué es el 'Capital Social' según Bourdieu?", a: "Recursos acumulados por individuos o grupos a través de redes de relaciones duraderas que proporcionan ventajas sociales." },
            { q: "¿Qué es la 'Elección Racional' en sociología?", a: "Teoría que explica la acción social como resultado de cálculos estratégicos de costos y beneficios por parte de los actores." },
            { q: "¿Qué es la 'Institución' en sentido sociológico?", a: "Patrones de comportamiento estables, normas, valores y prácticas organizadas que estructuran la vida social." },
            { q: "¿Qué es el 'Institucionalismo'?", a: "Corriente teórica que enfatiza el papel de las instituciones en dar forma al comportamiento y la organización social." },
            { q: "¿Qué es la 'Economía Informal'?", a: "Actividades económicas realizadas fuera de los canales oficiales, sin regulación ni protección estatal." },
            { q: "¿Qué es la 'Globalización' económica?", a: "Proceso de interconexión de las economías nacionales a través de flujos de comercio, inversión y tecnología." },
            { q: "¿Qué es el 'Neoliberalismo'?", a: "Corriente económica que promueve la свободad de mercado, la privatización y la reducción del intervención estatal." },
            { q: "¿Qué es el 'Capitalismo'?", a: "Sistema económico basado en la propiedad privada de los medios de producción y la búsqueda de lucro en el mercado." },
            { q: "¿Qué es el 'Mercado' en sociología económica?", a: "Espacio social donde ocurren intercambios regulados por oferta, demanda, normas y relaciones de poder." },
            { q: "¿Qué son las 'Redes Sociales' en economía?", a: "Estructuras de relaciones entre actores económicos que facilitan el flujo de información, recursos y oportunidades." },
            { q: "¿Qué es la 'Confianza Social' en economía?", a: "Expectativa de que otros actuarán de manera confiable y honesta, reduciendo costos de transacción." },
            { q: "¿Qué es el 'Capital' en Marx?", a: "Valor que se autorreproduce y увеличивается a través de la explotación del trabajo en el proceso productivo." },
            { q: "¿Qué es la 'Acumulación de Capital'?", a: "Proceso de reinvestir ganancias para aumentar la cantidad de capital y la capacidad productiva." },
            { q: "¿Qué es el 'Consumismo'?", a: "Cultura basada en el consumo excesivo de bienes y servicios como forma de identidad y satisfacción personal." },
            { q: "¿Qué es la 'Desigualdad Social'?", a: "Diferencia sistemática en el acceso a recursos, oportunidades y poder entre grupos sociales." },
            { q: "¿Qué es la 'Movilidad Social'?", a: "Movimiento de individuos o grupos entre diferentes posiciones en la estructura social (vertical u horizontal)." },

            // UNIDAD 3: CULTURA Y SOCIALIZACIÓN
            { q: "¿Qué es la 'Cultura' en sociología?", a: "Conjunto de conocimientos, creencias, normas, valores, símbolos y prácticas heredadas y compartilhidas por una sociedad." },
            { q: "¿Qué diferencia hay entre Cultura Material e Inmaterial?", a: "Material: objetos tangibles (herramientas, tecnología, arquitectura). Inmaterial: intangibles (valores, normas, lengua, creencias)." },
            { q: "¿Qué es la 'Socialización'?", a: "Proceso de aprendizaje e internalización de normas, valores, roles y cultura de una sociedad por los individuos." },
            { q: "¿Qué es la 'Socialización Primaria'?", a: "Proceso en la primera infancia (familia) donde se internaliza el lenguaje, valores básicos y la identidad personal." },
            { q: "¿Qué es la 'Socialización Secundaria'?", a: "Proceso en la edad adulta donde se aprenden normas, valores y roles de instituciones específicas (escuela, trabajo)." },
            { q: "¿Qué es el 'Agente de Socialización'?", a: "Institución o persona que transmite normas, valores y conocimientos durante el proceso de socialización (familia, escuela, medios)." },
            { q: "¿Qué es el 'Etnocentrismo'?", a: "Tendencia a juzgar otras culturas usando los estándares de la propia, asumiendo su superioridad." },
            { q: "¿Qué es el 'Relativismo Cultural'?", a: "Enfoque que busca comprender las prácticas culturales desde su propio contexto, sin juzgarlas según criterios ajenos." },
            { q: "¿Qué es la 'Cultura Popular'?", a: "Conjunto de expresiones culturales (música, cine, moda, lenguaje) creadas y compartilhidas por las clases populares." },
            { q: "¿Qué es la 'Cultura de Masas'?", a: "Producción cultural estandarizada destinada a grandes audiencias, desarrollada por industrias culturales modernas." },
            { q: "¿Qué es el 'Paradigma' según Kuhn?", a: "Conjunto de creencias, valores y técnicas compartidas por una comunidad científica que define cómo se ve y estudia la realidad." },
            { q: "¿Qué es el 'Contracultura'?", a: "Movimiento cultural que rejectiona y挑战a los valores dominantes de la sociedad establecida." },
            { q: "¿Qué es la 'Identidad Social'?", a: "Sentido de pertenencia a grupos sociales (étnicos, nacionales, de género) que influye en la autodefinición del individuo." },
            { q: "¿Qué es el 'Ciclo de la Socialización'?", a: "Proceso contínuo donde cada generación transmite cultura a la siguiente, reproduciendo y transformando la sociedad." },
            { q: "¿Qué es el 'Papel' o 'Rol Social'?", a: "Conjunto de expectativas y comportamientos asociados a una posición específica en la estructura social." },
            { q: "¿Qué es la 'Cultura de la Información'?", a: "Sociedad donde el conocimiento y la información son recursos centrales, transformados por tecnología digital." },
            { q: "¿Qué son los 'Valores' en cultura?", a: "Principios abstractos que guían el comportamiento y evalúan lo que es importante o deseable en una sociedad." },
            { q: "¿Qué son las 'Normas Sociales'?", a: "Reglas explícitas o implícitas que definen los comportamientos apropiados en una situación social determinada." },
            { q: "¿Qué es el 'Diseño de la Cultura' (Cultural Engineering)?", a: "Proceso deliberado de crear, modificar o controlar elementos culturales para fines específicos." },
            { q: "¿Qué es la 'Socialización Diferencial'?", a: "Proceso donde diferentes grupos sociales internalizan normas y valores de manera distinta según su posición social." }
        ];

        let currentIndex = 0;
        const cardElement = document.getElementById('flashcard');
        const qText = document.getElementById('question-text');
        const aText = document.getElementById('answer-text');
        const counterText = document.getElementById('card-counter');
        const progressBar = document.getElementById('progress-bar');

        // Optional: Simple soft tick sound for interactions
        const flipSound = new Audio('data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTQAAAAA/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8=');
        flipSound.volume = 0.1;

        function flipCard() {
            cardElement.classList.toggle('flipped');
            try { flipSound.play().catch(e => {}); } catch(e) {}
        }

        function updateCard() {
            cardElement.classList.remove('flipped');
            
            // Calculate progress
            const progress = ((currentIndex + 1) / cardsData.length) * 100;
            progressBar.style.width = `${progress}%`;

            setTimeout(() => {
                qText.textContent = cardsData[currentIndex].q;
                aText.textContent = cardsData[currentIndex].a;
                counterText.textContent = `Tarjeta ${currentIndex + 1} de ${cardsData.length}`;
            }, 250); // Waited for flip animation to be mostly hidden
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % cardsData.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
            updateCard();
        }

        // Add keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        // Initialize
        updateCard();
    </script>
</body>

</html>
