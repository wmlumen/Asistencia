<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilla de Asistencia - Instituto Superior Centuria</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="script.js?v=2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .planilla-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border: 2px solid #333;
        }
        
        /* Encabezado del instituto */
        .header-instituto {
            text-align: center;
            padding: 15px;
            border-bottom: 2px solid #333;
            background: white;
        }
        
        .header-instituto h1 {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0;
        }
        
        /* Fila de información */
        .info-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            border-bottom: 1px solid #333;
        }
        
        .info-cell {
            padding: 8px 12px;
            border-right: 1px solid #333;
            font-size: 11px;
        }
        
        .info-cell:last-child {
            border-right: none;
        }
        
        .info-cell label {
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
            font-size: 10px;
            text-transform: uppercase;
        }
        
        .info-cell .value {
            min-height: 16px;
            border-bottom: 1px solid #999;
        }
        
        /* Tabla de asistencia */
        .tabla-asistencia {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }
        
        .tabla-asistencia th,
        .tabla-asistencia td {
            border: 1px solid #333;
            padding: 6px 4px;
            text-align: center;
        }
        
        .tabla-asistencia th {
            background: #e8e8e8;
            font-weight: bold;
            font-size: 10px;
        }
        
        .tabla-asistencia th:first-child,
        .tabla-asistencia td:first-child {
            text-align: left;
            padding-left: 8px;
        }
        
        .tabla-asistencia th:nth-child(2),
        .tabla-asistencia td:nth-child(2) {
            text-align: left;
            padding-left: 8px;
            min-width: 180px;
        }
        
        .col-cedula {
            width: 100px;
        }
        
        .col-nombre {
            width: 200px;
        }
        
        .col-fecha {
            width: 50px;
            min-width: 40px;
        }
        
        /* Estados */
        .presente {
            color: #0066cc;
            font-weight: bold;
            font-size: 12px;
        }
        
        .ausente {
            color: #cc0000;
            font-weight: bold;
            font-size: 12px;
        }
        
        .ausencia-justificada {
            color: #ff6600;
            font-weight: bold;
            font-size: 12px;
        }
        
        /* Login overlay */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .login-overlay.hidden {
            display: none;
        }
        
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        
        .login-box h2 {
            margin-bottom: 20px;
        }
        
        .login-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .login-btn:hover {
            background: #0052a3;
        }
        
        .login-error {
            color: #cc0000;
            margin-top: 10px;
            display: none;
        }
        
        .login-error.show {
            display: block;
        }
        
        /* Controles */
        .controles {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .btn.active {
            background: #0066cc;
            color: white;
            border-color: #0066cc;
        }
        
        .btn:hover {
            background: #f0f0f0;
        }
        
        .btn.active:hover {
            background: #0052a3;
        }
        
        /* Leyenda */
        .leyenda {
            margin-top: 15px;
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            font-size: 11px;
        }
        
        .leyenda-item {
            display: inline-block;
            margin-right: 20px;
        }
        
        .leyenda-item strong {
            margin-right: 5px;
        }
        
        /* Responsive */
        @media print {
            body { background: white; padding: 0; }
            .controles, .login-overlay { display: none !important; }
            .planilla-container { border: 1px solid #333; }
        }
        
        @media (max-width: 768px) {
            .tabla-asistencia { font-size: 9px; }
            .tabla-asistencia th, .tabla-asistencia td { padding: 3px 2px; }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> Planilla de Asistencia</h2>
            <p>Instituto Superior Centuria</p>
            <input type="password" class="login-input" id="loginPassword" placeholder="Contraseña" onkeypress="if(event.key==='Enter')checkLogin()">
            <button class="login-btn" onclick="checkLogin()">
                <i class="fas fa-unlock"></i> Acceder
            </button>
            <div class="login-error" id="loginError">Contraseña incorrecta</div>
            <a href="index.html" style="display:block;margin-top:15px;color:#666;font-size:12px;">
                <i class="fas fa-home"></i> Volver al inicio
            </a>
        </div>
    </div>

    <!-- Contenido principal -->
    <div id="mainContent" style="display:none;">
        <div class="controles">
            <a href="index.html" class="btn">
                <i class="fas fa-home"></i> Inicio
            </a>
            <button class="btn" data-source="api" onclick="setDataSource('api')">
                <i class="fas fa-cloud"></i> API
            </button>
            <button class="btn" data-source="csv" onclick="setDataSource('csv')">
                <i class="fas fa-file-csv"></i> CSV
            </button>
            <button class="btn" data-source="local" onclick="setDataSource('local')">
                <i class="fas fa-hdd"></i> Local
            </button>
            <button class="btn" onclick="window.print()">
                <i class="fas fa-print"></i> Imprimir
            </button>
            <span id="statusText" style="font-size:12px;color:#666;"></span>
        </div>

        <div class="planilla-container" id="planillaContainer">
            <div class="header-instituto">
                <h1>INSTITUTO SUPERIOR CENTURIA</h1>
            </div>
            
            <div class="info-row">
                <div class="info-cell">
                    <label>CARRERA</label>
                    <div class="value" id="info-carrera"></div>
                </div>
                <div class="info-cell">
                    <label>SECCION</label>
                    <div class="value" id="info-seccion"></div>
                </div>
                <div class="info-cell">
                    <label>PERIODO</label>
                    <div class="value" id="info-periodo"></div>
                </div>
                <div class="info-cell">
                    <label>MES</label>
                    <div class="value" id="info-mes"></div>
                </div>
                <div class="info-cell">
                    <label>PROFESOR</label>
                    <div class="value" id="info-profesor"></div>
                </div>
            </div>
            
            <table class="tabla-asistencia" id="tablaAsistencia">
                <thead>
                    <tr>
                        <th class="col-cedula">CEDULA</th>
                        <th class="col-nombre">NOMBRE Y APELLIDO</th>
                        <!-- Las fechas se generan dinámicamente -->
                        <th id="th-fechas"></th>
                    </tr>
                </thead>
                <tbody id="tbody-asistencia">
                    <!-- Los datos se cargan dinámicamente -->
                </tbody>
            </table>
        </div>
        
        <div class="leyenda">
            <span class="leyenda-item"><strong class="presente">P</strong> = Presente</span>
            <span class="leyenda-item"><strong class="ausente">A</strong> = Ausente</span>
            <span class="leyenda-item"><strong class="ausencia-justificada">AJ</strong> = Ausencia Justificada</span>
        </div>
    </div>

    <script>
        let dataSource = localStorage.getItem('planilla_fuente') || '';
        
        function checkLogin() {
            const input = document.getElementById('loginPassword');
            const error = document.getElementById('loginError');
            const result = loginTeacher(input.value.trim());
            if (result.ok) {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('mainContent').style.display = 'block';
                if (dataSource) setDataSource(dataSource);
            } else {
                error.classList.add('show');
                input.value = '';
                input.focus();
            }
        }
        
        function setDataSource(source) {
            dataSource = source;
            localStorage.setItem('planilla_fuente', source);
            document.querySelectorAll('.btn[data-source]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.source === source);
            });
            cargarPlanilla();
        }
        
        async function cargarPlanilla() {
            const statusText = document.getElementById('statusText');
            const tbody = document.getElementById('tbody-asistencia');
            const thFechas = document.getElementById('th-fechas');
            
            statusText.textContent = 'Cargando...';
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin"></i> Cargando datos...</td></tr>';
            
            let records = [];
            let justificaciones = [];
            
            try {
                if (dataSource === 'api') {
                    const apiUrl = (typeof getAttendanceApiUrl === 'function') ? getAttendanceApiUrl() : '';
                    if (apiUrl) {
                        const resp = await fetch(apiUrl + '?modo=registro&apiKey=' + encodeURIComponent(typeof getApiKey === 'function' ? getApiKey() : 'CenturiaApi2024!'));
                        if (resp.ok) {
                            const data = await resp.json();
                            records = data.registros || [];
                        }
                        
                        // Cargar justificaciones
                        const respJ = await fetch(apiUrl + '?modo=justificaciones&apiKey=' + encodeURIComponent(typeof getApiKey === 'function' ? getApiKey() : 'CenturiaApi2024!'));
                        if (respJ.ok) {
                            const dataJ = await respJ.json();
                            justificaciones = dataJ.justificaciones || [];
                        }
                    }
                    statusText.textContent = records.length + ' registros (API)';
                }
                else if (dataSource === 'csv') {
                    const csvUrl = (typeof getAttendanceCsvUrl === 'function') ? getAttendanceCsvUrl() : '';
                    if (csvUrl) {
                        const resp = await fetch(csvUrl);
                        if (resp.ok) {
                            const text = await resp.text();
                            if (typeof parseCSVToAttendance === 'function') {
                                records = parseCSVToAttendance(text);
                            }
                        }
                    }
                    statusText.textContent = records.length + ' registros (CSV)';
                }
                else if (dataSource === 'local') {
                    if (typeof loadAttendanceRecords === 'function') {
                        records = loadAttendanceRecords();
                    }
                    // Cargar justificaciones locales
                    try {
                        const jRaw = localStorage.getItem('justificaciones_ausencias');
                        if (jRaw) justificaciones = JSON.parse(jRaw);
                    } catch(e) {}
                    statusText.textContent = records.length + ' registros (Local)';
                }
            } catch(err) {
                console.error('Error:', err);
                statusText.textContent = 'Error al cargar';
            }
            
            if (!records.length && !justificaciones.length) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px;">No hay datos disponibles</td></tr>';
                return;
            }
            
            // Procesar registros
            const datosProcesados = {};
            const fechasSet = new Set();
            
            // Procesar asistencias
            records.forEach(r => {
                const cedula = (r.cedula || r.Cedula || r.studentId || '').toString().replace(/\./g, '').trim();
                const nombre = (r.nombre || r.Nombre || r.studentName || '').toUpperCase().trim();
                const carrera = (r.carrera || r.Carrera || r.career || '').toUpperCase().trim();
                const seccion = (r.seccion || r.Seccion || r.section || '').toUpperCase().trim();
                const estado = (r.estado || r.Estado || 'Presente').trim();
                
                let fecha = '';
                const mt = r.marcaTemporal || r.MarcaTemporal || r.Fecha || r.fecha || '';
                const str = String(mt).trim();
                if (str.includes('/')) {
                    fecha = str.split(' ')[0];
                } else if (str.includes('-')) {
                    const p = str.split(' ')[0].split('-');
                    if (p[0].length === 4) {
                        fecha = p[2] + '/' + p[1] + '/' + p[0];
                    } else {
                        fecha = p[0] + '/' + p[1] + '/' + p[2];
                    }
                }
                
                if (!cedula || !fecha) return;
                
                if (!datosProcesados[cedula]) {
                    datosProcesados[cedula] = {
                        nombre: nombre,
                        carrera: carrera,
                        seccion: seccion,
                        fechas: {}
                    };
                }
                
                datosProcesados[cedula].fechas[fecha] = estado === 'Ausencia Justificada' ? 'AJ' : 'P';
                fechasSet.add(fecha);
            });
            
            // Procesar justificaciones
            justificaciones.forEach(j => {
                const cedula = (j.cedula || j.Cedula || '').toString().replace(/\./g, '').trim();
                const nombre = (j.nombre || j.Nombre || '').toUpperCase().trim();
                const carrera = (j.carrera || j.Carrera || '').toUpperCase().trim();
                const seccion = (j.seccion || j.Seccion || '').toUpperCase().trim();
                let fecha = j.fecha || j.Fecha || j.fechaAusencia || '';
                
                if (!cedula || !fecha) return;
                
                if (!datosProcesados[cedula]) {
                    datosProcesados[cedula] = {
                        nombre: nombre,
                        carrera: carrera,
                        seccion: seccion,
                        fechas: {}
                    };
                }
                
                // Solo marcar como AJ si no hay asistencia ese día
                if (!datosProcesados[cedula].fechas[fecha]) {
                    datosProcesados[cedula].fechas[fecha] = 'AJ';
                }
                fechasSet.add(fecha);
            });
            
            // Ordenar fechas
            const fechasOrdenadas = Array.from(fechasSet).sort();
            
            // Actualizar info
            const cedulas = Object.keys(datosProcesados);
            if (cedulas.length > 0) {
                const primero = datosProcesados[cedulas[0]];
                document.getElementById('info-carrera').textContent = primero.carrera || '';
                document.getElementById('info-seccion').textContent = primero.seccion || '';
            }
            document.getElementById('info-periodo').textContent = new Date().getFullYear();
            document.getElementById('info-mes').textContent = new Date().toLocaleString('es-PY', { month: 'long' }).toUpperCase();
            document.getElementById('info-profesor').textContent = (typeof CONFIG !== 'undefined' && CONFIG.name_docente) ? CONFIG.name_docente : '';
            
            // Generar encabezados de fechas
            let fechasHTML = '';
            fechasOrdenadas.forEach((f, index) => {
                fechasHTML += '<th class="col-fecha">FECHA ' + (index + 1) + '<br><small>' + f + '</small></th>';
            });
            thFechas.outerHTML = fechasHTML;
            
            // Generar filas
            let tbodyHTML = '';
            cedulas.sort().forEach(cedula => {
                const info = datosProcesados[cedula];
                tbodyHTML += '<tr>';
                tbodyHTML += '<td>' + cedula + '</td>';
                tbodyHTML += '<td>' + info.nombre + '</td>';
                
                fechasOrdenadas.forEach(fecha => {
                    const estado = info.fechas[fecha];
                    if (estado === 'P') {
                        tbodyHTML += '<td class="presente">P</td>';
                    } else if (estado === 'AJ') {
                        tbodyHTML += '<td class="ausencia-justificada">AJ</td>';
                    } else {
                        tbodyHTML += '<td class="ausente">A</td>';
                    }
                });
                
                tbodyHTML += '</tr>';
            });
            
            tbody.innerHTML = tbodyHTML;
        }
        
        // Verificar sesión al cargar
        (function() {
            if (typeof isTeacherSessionActive === 'function' && isTeacherSessionActive()) {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('mainContent').style.display = 'block';
                if (dataSource) setDataSource(dataSource);
            }
        })();
    </script>
</body>
</html>
