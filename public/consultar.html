<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Resultados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="institutional.css">
    <style>
        .glass-panel-light { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .background-blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        .blob { position: absolute; filter: blur(80px); opacity: 0.6; border-radius: 50%; }
        .blob-1 { width: 400px; height: 400px; background: #059669; top: -100px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; background: #a3e635; bottom: -100px; right: -100px; }
    </style>
</head>
<body class="animated-bg text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="glass-panel-light max-w-md w-full relative z-10 overflow-hidden">
        <div class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-lime-700 p-6 text-center relative overflow-hidden">
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
                <div class="relative z-10">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-xs font-bold uppercase tracking-[0.3em] text-emerald-100">Institución</p>
                    <a href="index.html" class="text-white text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 no-underline">
                        <i class="fas fa-home text-[10px]"></i> Volver al inicio
                    </a>
                </div>
                <img src="logo_centuria_blanco.png" alt="Logo Centuria" style="height:50px;margin-bottom:10px;">
                <h1 class="text-white text-2xl font-bold tracking-tight">Consultar Resultados</h1>
            </div>
        </div>
        
        <div class="p-6">
            <!-- Buscador -->
            <div id="buscador" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Ingrese su Cédula de Identidad</label>
                    <input type="text" id="cedula-buscar" 
                        class="w-full bg-white/50 border-2 border-slate-200 rounded-xl px-4 py-3 text-lg focus:border-emerald-500 focus:outline-none text-center"
                        placeholder="Ej: 12345678">
                </div>
                
                <button onclick="buscarResultados()" 
                    class="w-full bg-gradient-to-r from-emerald-600 to-emerald-800 hover:from-emerald-700 hover:to-emerald-900 text-white font-bold py-3 rounded-xl shadow-lg hover:-translate-y-0.5 transition-all duration-300">
                    <i class="fas fa-search mr-2"></i> Buscar Resultados
                </button>
                
                <p class="text-center text-xs text-slate-400">
                    Ingrese su cédula para ver sus intentos
                </p>
            </div>
            
            <!-- Cargando -->
            <div id="cargando" class="hidden text-center py-8">
                <div class="loader mx-auto mb-4"></div>
                <p class="text-slate-500">Buscando resultados...</p>
            </div>
            
            <!-- Resultados -->
            <div id="resultados" class="hidden space-y-4">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="nuevaBusqueda()" class="text-emerald-600 hover:underline text-sm font-medium">
                        <i class="fas fa-arrow-left mr-1"></i> Nueva búsqueda
                    </button>
                </div>
                
                <div id="lista-resultados" class="space-y-3"></div>
            </div>
            
            <!-- Sin resultados -->
            <div id="sin-resultados" class="hidden text-center py-8">
                <i class="fas fa-search text-4xl text-slate-300 mb-4"></i>
                <p class="text-slate-600 font-medium">No se encontraron resultados</p>
                <p class="text-slate-400 text-sm">Verifique su cédula e intente nuevamente</p>
                <button onclick="nuevaBusqueda()" class="mt-4 text-emerald-600 hover:underline font-medium">
                    Intentar nuevamente
                </button>
            </div>
        </div>
        
        <div class="bg-white/40 backdrop-blur-sm p-4 text-center border-t border-slate-200/50">
            <a href="index.html" class="text-emerald-600 font-medium text-sm hover:underline">
                <i class="fas fa-home mr-1"></i> Volver al Inicio
            </a>
        </div>
    </div>

    <script>
        function buscarResultados() {
            const cedula = document.getElementById('cedula-buscar').value.trim();
            
            if (!cedula) {
                alert('Por favor ingrese su cédula');
                return;
            }
            
            // Mostrar loading
            document.getElementById('buscador').classList.add('hidden');
            document.getElementById('cargando').classList.remove('hidden');
            
            // Simular búsqueda
            setTimeout(() => {
                const resultados = JSON.parse(localStorage.getItem('socioResults') || '[]');
                const intentos = resultados
                    .filter(r => r.ci === cedula)
                    .sort((a, b) => new Date(b.datetime) - new Date(a.datetime));
                
                document.getElementById('cargando').classList.add('hidden');
                
                if (intentos.length > 0) {
                    mostrarResultados(intentos);
                } else {
                    document.getElementById('sin-resultados').classList.remove('hidden');
                }
            }, 800);
        }
        
        function mostrarResultados(intentos) {
            const container = document.getElementById('lista-resultados');
            let html = `<h3 class="font-bold text-lg text-slate-700 mb-4">
                <i class="fas fa-user mr-2"></i>${intentos[0].name}
            </h3>`;
            
            intentos.forEach((r, idx) => {
                const percent = ((r.score / 30) * 100).toFixed(0);
                const estado = percent >= 60 ? 'aprobado' : 'reprobado';
                const estadoTexto = percent >= 60 ? 'APROBADO' : 'REPROBADO';
                
                html += `
                    <div class="resultado-card bg-white/70 backdrop-blur-sm border ${percent >= 60 ? 'border-emerald-200' : 'border-rose-200'} p-4 rounded-xl shadow-sm mb-3">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="text-xs font-bold text-slate-500">Intento #${idx + 1}</span>
                                <div class="text-xs text-slate-400">${r.date} - ${r.time}</div>
                            </div>
                            <div class="text-right">
                                <span class="text-2xl font-bold ${percent >= 60 ? 'text-emerald-600' : 'text-rose-600'}">${r.score}/30</span>
                                <div class="text-sm font-bold ${percent >= 60 ? 'text-emerald-500' : 'text-rose-500'}">${percent}%</div>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="bg-white/80 p-2 rounded-lg">
                                <span class="text-slate-500">Sel. Múltiple:</span>
                                <span class="font-bold text-emerald-600 ml-1">${r.summary ? r.summary[0].correct : '-'}/15</span>
                            </div>
                            <div class="bg-white/80 p-2 rounded-lg">
                                <span class="text-slate-500">Verd/Falso:</span>
                                <span class="font-bold text-emerald-600 ml-1">${r.summary ? r.summary[1].correct : '-'}/15</span>
                            </div>
                        </div>
                        
                        <div class="mt-3 text-center">
                            <span class="inline-block px-3 py-1 rounded-full text-xs font-bold ${percent >= 60 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                                ${estadoTexto}
                            </span>
                        </div>
                    </div>
                `;
            });
            
            // Si hay mejor nota
            const mejor = Math.max(...intentos.map(r => r.score));
            const mejorPercent = ((mejor / 30) * 100).toFixed(0);
            
            html += `
                <div class="mt-4 p-4 bg-emerald-50/80 rounded-xl border border-emerald-200 shadow-inner">
                    <div class="text-center">
                        <span class="text-sm text-slate-600">Mejor Nota:</span>
                        <span class="text-xl font-bold text-emerald-600 ml-2">${mejor}/30 (${mejorPercent}%)</span>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            document.getElementById('resultados').classList.remove('hidden');
        }
        
        function nuevaBusqueda() {
            document.getElementById('resultados').classList.add('hidden');
            document.getElementById('sin-resultados').classList.add('hidden');
            document.getElementById('buscador').classList.remove('hidden');
            document.getElementById('cedula-buscar').value = '';
        }
        
        // Permitir buscar con Enter
        document.getElementById('cedula-buscar').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarResultados();
            }
        });
    </script>

<script src="script.js?v=2"></script>
<script>
(function() {
    function initAuth() {
        if (typeof isTeacherSessionActive !== 'function') {
            setTimeout(initAuth, 100);
            return;
        }
        if (!isTeacherSessionActive()) {
            document.body.innerHTML = '';
            const div = document.createElement('div');
            div.id = 'teacher-login-container';
            document.body.appendChild(div);
            renderTeacherLoginOverlay('teacher-login-container', function() {
                window.location.reload();
            });
        } else {
            const header = document.querySelector('.glass-panel-light > div:first-child > div.relative');
            if (header) {
                const btn = document.createElement('a');
                btn.href = '#';
                btn.innerHTML = '<i class="fas fa-sign-out-alt"></i> Cerrar sesión';
                btn.className = 'text-white text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 no-underline';
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    logoutTeacher();
                    window.location.href = 'index.html';
                });
                header.querySelector('.flex').appendChild(btn);
            }
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAuth);
    } else {
        initAuth();
    }
})();
</script>

</body>
</html>
