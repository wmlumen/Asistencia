<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Asistencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js?v=2"></script>
    <style>
        .bar-bg { background: #e2e8f0; border-radius: 999px; height: 8px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 999px; transition: width 0.6s ease; }
        .bar-green { background: #10b981; }
        .bar-amber { background: #f59e0b; }
        .bar-rose { background: #f43f5e; }
        .glass-panel-light { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="animated-bg min-h-screen text-slate-800">
    <div class="background-blobs">
        <div class="blob blob-1" style="background: #059669;"></div>
        <div class="blob blob-2" style="background: #a3e635;"></div>
    </div>

    <main class="max-w-6xl mx-auto px-4 py-8 relative z-10">
        <div class="glass-panel-light p-6 md:p-8 mb-6">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900"><i class="fas fa-chart-pie text-emerald-600 mr-2"></i>Seguimiento de Asistencia</h1>
                    <p class="text-sm text-slate-500 mt-1">Porcentaje de asistencia por alumno (Tarde = 0.5)</p>
                </div>
                <div class="flex items-center gap-3">
                    <a href="index.html" class="text-sm text-slate-600 hover:text-emerald-700 font-medium"><i class="fas fa-home mr-1"></i> Inicio</a>
                    <a href="asistencia.html" class="text-sm text-slate-600 hover:text-emerald-700 font-medium"><i class="fas fa-clipboard-check mr-1"></i> Registrar</a>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white/80 rounded-xl p-4 border border-slate-200">
                    <p class="text-xs uppercase tracking-widest text-slate-400 font-bold">Total Alumnos</p>
                    <p id="stat-total-alumnos" class="text-3xl font-bold text-slate-800 mt-1">0</p>
                </div>
                <div class="bg-white/80 rounded-xl p-4 border border-slate-200">
                    <p class="text-xs uppercase tracking-widest text-slate-400 font-bold">Clases Dictadas</p>
                    <p id="stat-total-clases" class="text-3xl font-bold text-slate-800 mt-1">0</p>
                </div>
                <div class="bg-white/80 rounded-xl p-4 border border-slate-200">
                    <p class="text-xs uppercase tracking-widest text-slate-400 font-bold">Promedio %</p>
                    <p id="stat-promedio" class="text-3xl font-bold text-emerald-600 mt-1">0%</p>
                </div>
                <div class="bg-white/80 rounded-xl p-4 border border-slate-200">
                    <p class="text-xs uppercase tracking-widest text-slate-400 font-bold">En Riesgo (< 75%)</p>
                    <p id="stat-riesgo" class="text-3xl font-bold text-rose-600 mt-1">0</p>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-3 mb-4">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-search text-xs"></i></span>
                    <input type="text" id="search-student" placeholder="Buscar por nombre o cédula..." class="w-full bg-white/60 border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-sm focus:border-emerald-500 focus:outline-none">
                </div>
                <select id="filter-career" class="bg-white/60 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:border-emerald-500 focus:outline-none md:w-64">
                    <option value="">Todas las carreras</option>
                </select>
                <button onclick="cargarSeguimiento()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition-all"><i class="fas fa-sync-alt mr-1"></i> Actualizar</button>
            </div>

            <div class="overflow-x-auto rounded-xl border border-slate-200">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                        <tr>
                            <th class="px-4 py-3">Cédula</th>
                            <th class="px-4 py-3">Nombre</th>
                            <th class="px-4 py-3">Carrera</th>
                            <th class="px-4 py-3 text-center">Clases</th>
                            <th class="px-4 py-3 text-center">Presente</th>
                            <th class="px-4 py-3 text-center">Tarde</th>
                            <th class="px-4 py-3 text-center">Ausente</th>
                            <th class="px-4 py-3 text-right">%</th>
                        </tr>
                    </thead>
                    <tbody id="seguimiento-body" class="bg-white/70 divide-y divide-slate-100">
                        <tr>
                            <td colspan="8" class="py-10 text-center text-slate-400">
                                <i class="fas fa-spinner fa-spin text-2xl mb-2 block text-slate-300"></i>
                                Cargando datos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div id="source-note" class="mt-4 text-xs text-slate-400 text-center"></div>
        </div>
    </main>

    <script>
        let resumenData = [];
        let allCareers = [];

        async function cargarSeguimiento() {
            const tbody = document.getElementById('seguimiento-body');
            const sourceNote = document.getElementById('source-note');
            tbody.innerHTML = '<tr><td colspan="8" class="py-10 text-center text-slate-400"><i class="fas fa-spinner fa-spin text-2xl mb-2 block text-slate-300"></i>Cargando datos...</td></tr>';

            // Esperar a que CONFIG cargue
            await ensureConfigLoaded();

            let registros = [];

            try {
                if (typeof fetchAttendanceRemoteRecords === 'function') {
                    registros = await fetchAttendanceRemoteRecords();
                }
                if (registros && registros.length) {
                    resumenData = calcularResumenLocal(registros);
                    sourceNote.textContent = 'Fuente: Google Sheets (CSV)';
                } else {
                    throw new Error('Sin registros remotos');
                }
            } catch (e) {
                // Fallback: calcular desde localStorage
                const local = (typeof loadAttendanceRecords === 'function') ? loadAttendanceRecords() : [];
                resumenData = calcularResumenLocal(local);
                sourceNote.textContent = 'Fuente: almacenamiento local (configure asistencia.csv.url para sincronizar con Drive)';
            }

            // Extraer carreras únicas para el filtro
            allCareers = [...new Set(resumenData.map(r => r.Carrera || r.carrera).filter(Boolean))];
            const careerSelect = document.getElementById('filter-career');
            const currentVal = careerSelect.value;
            careerSelect.innerHTML = '<option value="">Todas las carreras</option>' +
                allCareers.map(c => `<option value="${c}">${c}</option>`).join('');
            careerSelect.value = currentVal;

            renderTabla();
            calcularStats();
        }

            // Extraer carreras únicas para el filtro
            allCareers = [...new Set(resumenData.map(r => r.Carrera || r.carrera).filter(Boolean))];
            const careerSelect = document.getElementById('filter-career');
            const currentVal = careerSelect.value;
            careerSelect.innerHTML = '<option value="">Todas las carreras</option>' +
                allCareers.map(c => `<option value="${c}">${c}</option>`).join('');
            careerSelect.value = currentVal;

            renderTabla();
            calcularStats();
        }

        function calcularResumenLocal(records) {
            const fechas = [...new Set(records.map(r => r.marcaTemporal ? r.marcaTemporal.split(' ')[0] : ''))];
            const totalClases = fechas.length;

            const mapa = {};
            records.forEach(r => {
                const ced = (r.cedula || '').toString().replace(/\./g, '').trim();
                if (!ced) return;
                if (!mapa[ced]) {
                    mapa[ced] = { nombre: r.nombre, carrera: r.carrera, presente: 0, tarde: 0, total: 0 };
                }
                mapa[ced].total++;
                if (r.estado === 'Tarde') mapa[ced].tarde++;
                else mapa[ced].presente++;
            });

            return Object.keys(mapa).map(cedula => {
                const r = mapa[cedula];
                const asistencias = r.presente + (r.tarde * 0.5);
                const ausencias = Math.max(0, totalClases - r.presente - r.tarde);
                const porcentaje = totalClases > 0 ? Math.round((asistencias / totalClases) * 100) : 0;
                return {
                    Cedula: cedula,
                    Nombre: r.nombre,
                    Carrera: r.carrera,
                    TotalClases: totalClases,
                    Asistencias: r.presente,
                    Tardanzas: r.tarde,
                    Ausencias: ausencias,
                    Porcentaje: porcentaje
                };
            });
        }

        function renderTabla() {
            const search = document.getElementById('search-student').value.trim().toLowerCase();
            const careerFilter = document.getElementById('filter-career').value;
            const tbody = document.getElementById('seguimiento-body');

            let filtrado = resumenData.filter(r => {
                const txt = `${r.Nombre || r.nombre} ${r.Cedula || r.cedula}`.toLowerCase();
                const matchSearch = !search || txt.includes(search);
                const matchCareer = !careerFilter || (r.Carrera || r.carrera) === careerFilter;
                return matchSearch && matchCareer;
            });

            // Ordenar por porcentaje descendente
            filtrado.sort((a, b) => (b.Porcentaje || b.porcentaje) - (a.Porcentaje || a.porcentaje));

            if (filtrado.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="py-10 text-center text-slate-400"><i class="fas fa-inbox text-2xl text-slate-300 mb-2 block"></i>No hay registros</td></tr>`;
                return;
            }

            tbody.innerHTML = filtrado.map(r => {
                const ced = r.Cedula || r.cedula;
                const nom = r.Nombre || r.nombre;
                const car = r.Carrera || r.carrera;
                const tot = r.TotalClases || r.totalClases || 0;
                const pre = r.Asistencias || r.asistencias || 0;
                const tar = r.Tardanzas || r.tardanzas || 0;
                const aus = r.Ausencias || r.ausencias || 0;
                const pct = r.Porcentaje || r.porcentaje || 0;

                let barClass = 'bar-green';
                if (pct < 75) barClass = 'bar-rose';
                else if (pct < 90) barClass = 'bar-amber';

                return `
                    <tr class="hover:bg-slate-50/80 transition-all">
                        <td class="px-4 py-3 font-mono text-slate-500">${ced}</td>
                        <td class="px-4 py-3 font-semibold text-slate-800">${nom}</td>
                        <td class="px-4 py-3 text-slate-600">${car}</td>
                        <td class="px-4 py-3 text-center font-bold">${tot}</td>
                        <td class="px-4 py-3 text-center text-emerald-600 font-bold">${pre}</td>
                        <td class="px-4 py-3 text-center text-amber-600 font-bold">${tar}</td>
                        <td class="px-4 py-3 text-center text-rose-600 font-bold">${aus}</td>
                        <td class="px-4 py-3 text-right">
                            <div class="flex items-center gap-2 justify-end">
                                <span class="font-bold ${pct < 75 ? 'text-rose-600' : (pct < 90 ? 'text-amber-600' : 'text-emerald-600')}">${pct}%</span>
                                <div class="bar-bg w-16">
                                    <div class="bar-fill ${barClass}" style="width: ${pct}%"></div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function calcularStats() {
            const totalAlumnos = resumenData.length;
            const totalClases = resumenData.length > 0 ? (resumenData[0].TotalClases || resumenData[0].totalClases || 0) : 0;
            const promedio = totalAlumnos > 0 ? Math.round(resumenData.reduce((s, r) => s + (r.Porcentaje || r.porcentaje || 0), 0) / totalAlumnos) : 0;
            const riesgo = resumenData.filter(r => (r.Porcentaje || r.porcentaje || 0) < 75).length;

            document.getElementById('stat-total-alumnos').textContent = totalAlumnos;
            document.getElementById('stat-total-clases').textContent = totalClases;
            document.getElementById('stat-promedio').textContent = promedio + '%';
            document.getElementById('stat-riesgo').textContent = riesgo;
        }

        // Listeners
        document.getElementById('search-student').addEventListener('input', renderTabla);
        document.getElementById('filter-career').addEventListener('change', renderTabla);

        // Inicializar
        cargarSeguimiento();
    </script>
</body>
</html>
