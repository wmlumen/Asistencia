<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto Superior Centuria - Sociolog&iacute;a</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="institutional.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1e3a5f, #2d5a87);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
            color: white;
            box-shadow: 0 8px 24px rgba(30,58,95,0.3);
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 32px;
            font-weight: 500;
        }
        .panel-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            text-decoration: none;
            color: #1e293b;
        }
        .panel-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .panel-btn i {
            font-size: 20px;
        }
        .panel-btn.estudiante {
            border-color: #2563eb;
            color: #2563eb;
        }
        .panel-btn.estudiante:hover {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .panel-btn.docente {
            border-color: #7c3aed;
            color: #7c3aed;
        }
        .panel-btn.docente:hover {
            background: #7c3aed;
            color: white;
            border-color: #7c3aed;
        }
        .footer-text {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 28px;
        }
        .footer-text i {
            color: #cbd5e1;
        }
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            display: none;
        }
        .error-msg.show {
            display: block;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .info-text {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <i class="fas fa-graduation-cap"></i>
    </div>
    <h1>Instituto Superior Centuria</h1>
    <p class="subtitle">Sociolog&iacute;a &middot; Acceso al Sistema</p>

    <div class="info-text">
        <i class="fas fa-shield-alt" style="margin-right:4px;"></i>
        Seleccione su perfil e ingrese la contrase&ntilde;a correspondiente
    </div>

    <div id="error-msg" class="error-msg">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-text">Contrase&ntilde;a incorrecta</span>
    </div>

    <button class="panel-btn estudiante" onclick="accederPanel('estudiante')">
        <i class="fas fa-user-graduate"></i>
        Panel Estudiante
    </button>

    <button class="panel-btn docente" onclick="accederPanel('docente')">
        <i class="fas fa-chalkboard-teacher"></i>
        Panel Docente
    </button>

    <div class="footer-text">
        <i class="fas fa-lock"></i> Acceso restringido &middot; Instituto Superior Centuria 2026
    </div>
</div>

<script>
function accederPanel(tipo) {
    var errorDiv = document.getElementById('error-msg');
    var errorText = document.getElementById('error-text');

    var password;
    var destino;
    var correctPassword;

    if (tipo === 'estudiante') {
        correctPassword = 'Alumno2026';
        destino = 'student_panel.html';
    } else {
        correctPassword = 'Docente2026';
        destino = 'teacher_panel.html';
    }

    password = prompt('Ingrese la contrase\u00f1a para acceder al ' + (tipo === 'estudiante' ? 'Panel Estudiante' : 'Panel Docente') + ':');

    if (password === null) {
        // Cancelado
        return;
    }

    if (password === correctPassword) {
        errorDiv.classList.remove('show');
        window.location.href = destino;
    } else {
        errorText.textContent = 'Contrase\u00f1a incorrecta. Intente nuevamente.';
        errorDiv.classList.add('show');
        setTimeout(function() {
            errorDiv.classList.remove('show');
        }, 3000);
    }
}
</script>

</body>
</html>
