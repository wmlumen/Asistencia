<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Primer Parcial - Sociología 2026 | Instituto Superior Centuria</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #047857;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.9);
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #f8fafc;
            min-height: 100vh;
            padding: 24px;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(16,185,129,0.15), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(4,120,87,0.2), transparent 50%);
        }
        .container { max-width: 900px; margin: 0 auto; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #34d399, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .question { margin-bottom: 24px; }
        .question-text {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .q-num {
            background: linear-gradient(135deg, #34d399, #059669);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            flex-shrink: 0;
        }
        .options { display: flex; flex-direction: column; gap: 8px; margin-left: 38px; }
        .option {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .option:hover { border-color: var(--primary); background: rgba(16,185,129,0.05); }
        .option input { accent-color: var(--primary); width: 18px; height: 18px; }
        .option.correct { border-color: #10b981; background: rgba(16,185,129,0.1); }
        .option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.1); }
        .actions { text-align: center; margin-top: 32px; }
        .btn {
            background: linear-gradient(135deg, #34d399, #059669);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .result-box {
            display: none;
            text-align: center;
            padding: 32px;
        }
        .score {
            font-size: 64px;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #34d399, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .detail { font-size: 14px; color: #94a3b8; margin-top: 8px; }
        .login-form { display: flex; flex-direction: column; gap: 12px; }
        .login-form input {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: #f8fafc;
            font-size: 15px;
        }
        .login-form input::placeholder { color: #64748b; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-scroll mr-2"></i> Examen Primer Parcial</h1>
            <p style="color:#94a3b8;margin-top:6px;">Instituto Superior Centuria — Sociología 2026</p>
        </div>

        <!-- Login del alumno -->
        <div class="card" id="login-card">
            <h2 style="margin-bottom:16px;font-size:18px;"><i class="fas fa-user-graduate mr-2"></i> Datos del alumno</h2>
            <div class="login-form">
                <input type="text" id="student-name" placeholder="Nombre y Apellido" required>
                <input type="text" id="student-id" placeholder="Cédula de Identidad" required>
                <button class="btn" id="start-btn" onclick="beginExam()"><i class="fas fa-play mr-2"></i> Iniciar examen</button>
                <p id="attempt-info" style="font-size:12px;color:#94a3b8;text-align:center;"></p>
            </div>
        </div>

        <!-- Examen -->
        <div class="card hidden" id="exam-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <span style="font-size:12px;color:#94a3b8;">20 preguntas — Selección múltiple y Verdadero/Falso</span>
                <span id="timer" style="font-size:12px;color:#fbbf24;">30:00</span>
            </div>
            <div id="questions"></div>
            <div class="actions">
                <button class="btn" onclick="submitExam()"><i class="fas fa-paper-plane mr-2"></i> Entregar examen</button>
            </div>
        </div>

        <!-- Resultados -->
        <div class="card result-box" id="result-card">
            <div class="score" id="score">0/20</div>
            <div class="detail" id="detail"></div>
            <div class="actions" style="margin-top:20px;">
                <button class="btn" onclick="downloadResults()"><i class="fas fa-download mr-2"></i> Guardar resultado</button>
            </div>
        </div>
    </div>

    <script>
        const EXAM_KEY = 'primer_parcial_sociologia_2026_results';
        const ATTEMPT_KEY = 'primer_parcial_sociologia_2026_attempts';
        const MAX_ATTEMPTS = 2;
        const EXAM_TIME = 30 * 60;
        let answers = {};
        let submitted = false;
        let startTime = null;
        let timerInterval = null;
        let currentAttempt = 1;
        let bestResult = null;

        function loadAttempts() {
            try {
                const raw = localStorage.getItem(ATTEMPT_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    currentAttempt = data.attempts ? data.attempts.length + 1 : 1;
                    bestResult = data.bestResult || null;
                }
            } catch (e) {
                currentAttempt = 1;
                bestResult = null;
            }
        }

        function saveAttempt(result) {
            try {
                const raw = localStorage.getItem(ATTEMPT_KEY);
                let data = raw ? JSON.parse(raw) : { attempts: [], bestResult: null };
                data.attempts = data.attempts || [];
                data.attempts.push(result);
                if (!bestResult || result.score > bestResult.score) {
                    bestResult = result;
                    data.bestResult = bestResult;
                }
                localStorage.setItem(ATTEMPT_KEY, JSON.stringify(data));
            } catch (e) {
                console.error('Error saving attempt', e);
            }
        }

        function canAttempt() {
            try {
                const raw = localStorage.getItem(ATTEMPT_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    return (data.attempts || []).length < MAX_ATTEMPTS;
                }
            } catch (e) {}
            return true;
        }

        function generateQuestions() {
            return [
                { id: 1, type: 'mc', text: '¿Quién es considerado el padre de la sociología?', options: ['Auguste Comte', 'Karl Marx', 'Emile Durkheim', 'Max Weber'], answer: 'Auguste Comte' },
                { id: 2, type: 'vf', text: 'La sociología estudia únicamente el comportamiento individual.', answer: 'Falso' },
                { id: 3, type: 'mc', text: '¿Cuál es el método sociológico que busca comprender el sentido de las acciones sociales?', options: ['Explicación causal', 'Comprensión', 'Observación', 'Comparación histórica'], answer: 'Comprensión' },
                { id: 4, type: 'vf', text: 'Durkheim analizó el suicidio como hecho social.', answer: 'Verdadero' },
                { id: 5, type: 'mc', text: 'La cultura se transmite principalmente por:', options: ['Herencia biológica', 'Socialización', 'Mutación genética', 'Selección natural'], answer: 'Socialización' },
                { id: 6, type: 'vf', text: 'Los valores son normas concretas de conducta.', answer: 'Falso' },
                { id: 7, type: 'mc', text: 'Ejemplo de contracultura:', options: ['La música pop', 'El movimiento hippie', 'El sistema educativo', 'La moda'], answer: 'El movimiento hippie' },
                { id: 8, type: 'vf', text: 'La socialización primaria se da en la primera infancia.', answer: 'Verdadero' },
                { id: 9, type: 'mc', text: 'La estratificación social se refiere a:', options: ['La división del trabajo', 'La jerarquía por clase, status y poder', 'La educación formal', 'Las instituciones políticas'], answer: 'La jerarquía por clase, status y poder' },
                { id: 10, type: 'vf', text: 'Un rol social es un conjunto de expectativas asociadas a una posición.', answer: 'Verdadero' },
                { id: 11, type: 'mc', text: 'Según Weber, las clases sociales se organizan por:', options: ['Solo riqueza', 'Situación de clase, status y partido', 'Raza', 'Religión'], answer: 'Situación de clase, status y partido' },
                { id: 12, type: 'vf', text: 'La anomia es la falta de normas sociales.', answer: 'Verdadero' },
                { id: 13, type: 'mc', text: 'El método que usa encuestas y estadísticas es:', options: ['Cualiitativo', 'Cuantitativo', 'Histórico', 'Comparativo'], answer: 'Cuantitativo' },
                { id: 14, type: 'vf', text: 'Marx centró su análisis en la lucha de clases.', answer: 'Verdadero' },
                { id: 15, type: 'mc', text: 'La institución que transmite conocimientos oficiales es:', options: ['La familia', 'La escuela', 'El mercado', 'El Estado'], answer: 'La escuela' },
                { id: 16, type: 'vf', text: 'Las sanciones pueden ser positivas o negativas.', answer: 'Verdadero' },
                { id: 17, type: 'mc', text: 'Una sociedad de castas se caracteriza por:', options: ['Movilidad social alta', 'Poca movilidad social', 'Igualdad jurídica', 'Competencia económica'], answer: 'Poca movilidad social' },
                { id: 18, type: 'vf', text: 'La cultura material incluye creencias y valores.', answer: 'Falso' },
                { id: 19, type: 'mc', text: '¿Qué sociólogo estudió la ética protestante y el espíritu del capitalismo?', options: ['Durkheim', 'Weber', 'Marx', 'Comte'], answer: 'Weber' },
                { id: 20, type: 'vf', text: 'El estatus social depende únicamente del ingreso económico.', answer: 'Falso' }
            ];
        }

        function renderQuestions() {
            const container = document.getElementById('questions');
            container.innerHTML = questions.map(q => {
                const opts = q.options.map(opt => {
                    return `<label class="option">
                        <input type="radio" name="q${q.id}" value="${opt}" onchange="saveAnswer(${q.id}, '${opt.replace(/'/g, "\\'")}')">
                        <span>${opt}</span>
                    </label>`;
                }).join('');
                return `<div class="question" data-q="${q.id}">
                    <div class="question-text"><span class="q-num">${q.id}</span><span>${q.text}</span></div>
                    <div class="options">${opts}</div>
                </div>`;
            }).join('');
        }

        function saveAnswer(id, value) {
            if (submitted) return;
            answers[id] = value;
        }

        function beginExam() {
            loadAttempts();
            if (!canAttempt()) {
                alert('Ya completó los 2 intentos permitidos. Su mejor puntaje fue: ' + (bestResult ? bestResult.score + '/' + bestResult.total + ' (' + bestResult.percent + '%)' : 'N/A'));
                showBestResult();
                return;
            }
            const name = document.getElementById('student-name').value.trim();
            const id = document.getElementById('student-id').value.trim();
            if (!name || !id) { alert('Ingrese nombre y cédula'); return; }
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('exam-card').classList.remove('hidden');
            renderQuestions();
            startTimer();
        }

        function startTimer() {
            startTime = Date.now();
            let time = EXAM_TIME;
            const el = document.getElementById('timer');
            const int = setInterval(() => {
                if (submitted) { clearInterval(int); return; }
                const m = String(Math.floor(time/60)).padStart(2,'0');
                const s = String(time%60).padStart(2,'0');
                el.textContent = m+':'+s;
                if (time-- <= 0) { clearInterval(int); submitExam(); }
            }, 1000);
            timerInterval = int;
        }

        function submitExam() {
            if (submitted) return;
            submitted = true;
            if (timerInterval) clearInterval(timerInterval);
            let score = 0;
            const details = questions.map(q => {
                const ok = answers[q.id] === q.answer;
                if (ok) score++;
                return { id: q.id, question: q.text, answer: answers[q.id], correct: q.answer, ok };
            });
            const result = {
                student: document.getElementById('student-name').value.trim(),
                cedula: document.getElementById('student-id').value.trim(),
                date: new Date().toISOString(),
                attempt: currentAttempt,
                score,
                total: questions.length,
                percent: Math.round((score/questions.length)*100),
                details
            };
            localStorage.setItem(EXAM_KEY, JSON.stringify(result));
            saveAttempt(result);
            document.getElementById('exam-card').classList.add('hidden');
            const rc = document.getElementById('result-card');
            rc.style.display = 'block';
            document.getElementById('score').textContent = result.score + '/' + result.total + ' (' + result.percent + '%)';
            document.getElementById('detail').textContent = result.student + ' — Cédula: ' + result.cedula + ' — Intento ' + result.attempt;
            highlightAnswers();
        }

        function showBestResult() {
            if (!bestResult) return;
            document.getElementById('login-card').classList.add('hidden');
            const rc = document.getElementById('result-card');
            rc.style.display = 'block';
            document.getElementById('score').textContent = bestResult.score + '/' + bestResult.total + ' (' + bestResult.percent + '%)';
            document.getElementById('detail').textContent = bestResult.student + ' — Cédula: ' + bestResult.cedula + ' — Mejor resultado';
        }

        function downloadResults() {
            const raw = bestResult ? JSON.stringify(bestResult) : localStorage.getItem(EXAM_KEY);
            if (!raw) return;
            const blob = new Blob([raw], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'resultado_primer_parcial_' + Date.now() + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function highlightAnswers() {
            questions.forEach(q => {
                const box = document.querySelector(`.question[data-q="${q.id}"]`);
                if (!box) return;
                box.querySelectorAll('.option').forEach(opt => {
                    const val = opt.querySelector('input').value;
                    if (val === q.answer) opt.classList.add('correct');
                    if (answers[q.id] && val === answers[q.id] && val !== q.answer) opt.classList.add('wrong');
                });
            });
        }

        window.addEventListener('beforeunload', () => {
            if (submitted) {
                const raw = localStorage.getItem(EXAM_KEY);
                if (raw) {
                    const blob = new Blob([raw], { type: 'application/json' });
                    navigator.sendBeacon && navigator.sendBeacon('data:application/json,' + encodeURIComponent(raw));
                }
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            loadAttempts();
            const info = document.getElementById('attempt-info');
            if (info) {
                info.textContent = 'Intentos restantes: ' + Math.max(0, MAX_ATTEMPTS - ((currentAttempt - 1))) + ' / ' + MAX_ATTEMPTS;
            }
        });
    </script>
</body>
</html>
