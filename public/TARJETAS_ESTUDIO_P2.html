<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas Integradoras Finales - Centuria Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Inter:wght@400;600&display=swap');

        :root {
            --primary: #10b981;
            --primary-dark: #047857;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Mesh Gradient Background */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.15), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(4, 120, 87, 0.2), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(6, 78, 59, 0.2), transparent 50%);
            animation: pulseBg 15s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .font-title {
            font-family: 'Outfit', sans-serif;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }

        /* Flashcard Logic & 3D Effect */
        .card-container {
            perspective: 1500px;
            width: 100%;
            max-width: 600px;
            height: 380px;
            cursor: pointer;
            margin: 0 auto;
            position: relative;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            border-radius: 1.5rem;
            transform-style: preserve-3d;
        }

        /* Front Card */
        .card-front {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .card-front::before {
            content: "\f059"; /* Question mark icon */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 10rem;
            color: rgba(255, 255, 255, 0.02);
            z-index: 0;
            transform: rotate(15deg) translateZ(-50px);
        }

        /* Back Card */
        .card-back {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            transform: rotateY(180deg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .card-content {
            transform: translateZ(60px);
            z-index: 10;
        }

        /* Floating Animation for the Card */
        .floating {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #34d399, #059669);
            width: 0%;
            transition: width 0.5s ease-out;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        /* Custom Button Hover Effects */
        .btn-nav {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-nav::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s ease;
        }

        .btn-nav:hover::after {
            transform: translate(-50%, -50%) scale(1);
        }
        
        .answer-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
        }

        /* Responsive Tweaks for Mobile */
        @media (max-width: 768px) {
            .card-container {
                height: 320px;
            }
            .card-front, .card-back {
                padding: 1.5rem;
            }
            .card-front::before {
                font-size: 6rem;
                top: -10px;
                right: -5px;
            }
        }

    </style>
</head>

<body>
    <div class="bg-mesh"></div>

    <div class="max-w-5xl mx-auto px-4 py-12 relative z-10">

        <!-- Header -->
        <header class="text-center mb-16">
            <div class="inline-flex items-center justify-center space-x-3 mb-4">
                <span class="w-12 h-[1px] bg-emerald-500/50"></span>
                <span class="font-title font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200 tracking-widest text-sm uppercase">
                    Instituto Superior Centuria
                </span>
                <span class="w-12 h-[1px] bg-emerald-500/50"></span>
            </div>
            <h1 class="font-title text-4xl md:text-5xl lg:text-6xl font-extrabold text-white mb-4 tracking-tight">
                Examen <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-emerald-600">Final</span>
            </h1>
            <p class="text-lg text-slate-400 font-light max-w-2xl mx-auto">
                Guía de repaso intensivo Unidades 1 a 6. Prepárate con excelencia.
            </p>
        </header>

        <!-- Main Workspace -->
        <main class="glass-panel p-6 md:p-12 mb-12">
            
            <!-- Header of Card Area -->
            <div class="flex justify-between items-center mb-4">
                <span id="card-counter" class="font-title font-bold text-slate-300 text-sm tracking-widest uppercase">
                    Tarjeta 1 de 30
                </span>
                <span class="text-xs text-emerald-400 font-mono bg-emerald-400/10 px-3 py-1 rounded-full border border-emerald-400/20">
                    <i class="fas fa-layer-group mr-1"></i> Sociología
                </span>
            </div>

            <!-- Progress -->
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <!-- Flashcard -->
            <div class="card-container floating" id="flashcard" onclick="flipCard()">
                <div class="card-inner">
                    <div class="card-front">
                        <div class="card-content">
                            <p id="question-text" class="text-2xl md:text-3xl font-title font-bold leading-tight text-white mb-2">
                                Cargando pregunta...
                            </p>
                            <p class="text-sm text-slate-400 mt-6 font-light opacity-70 animate-pulse">
                                Haz clic para revelar
                            </p>
                        </div>
                    </div>
                    <div class="card-back">
                        <div class="card-content">
                            <div class="answer-label">Respuesta Correcta</div>
                            <p id="answer-text" class="text-xl md:text-2xl font-medium leading-relaxed text-white">
                                Cargando respuesta...
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="flex items-center justify-center gap-6 mt-12">
                <button onclick="prevCard()" class="btn-nav w-14 h-14 rounded-full bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:border-emerald-500/50 flex items-center justify-center shadow-lg">
                    <i class="fas fa-chevron-left text-xl"></i>
                </button>
                <button onclick="nextCard()" class="btn-nav px-8 py-4 rounded-full bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-title font-bold text-lg shadow-[0_0_20px_rgba(16,185,129,0.4)] hover:shadow-[0_0_30px_rgba(16,185,129,0.6)] transform hover:-translate-y-1">
                    Siguiente Tarjeta <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
            
        </main>

        <!-- Removed Tools Area -->

        <!-- Footer -->
        <footer class="mt-16 text-center">
            <a href="../index.html" class="inline-flex items-center justify-center text-slate-400 hover:text-emerald-400 font-medium transition duration-300 group">
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center mr-3 group-hover:border-emerald-500/50 group-hover:bg-slate-800/80">
                    <i class="fas fa-home"></i>
                </div>
                Volver al Dashboard Principal
            </a>
        </footer>

    </div>

    <script>
        const cardsData = [
            // U1 & U2
            { q: "¿Quién propuso la 'Ley de los Tres Estados'?", a: "Augusto Comte (Teológico, Metafísico y Positivo)." },
            { q: "¿Qué es la 'Incrustación Social' (Embeddedness)?", a: "La idea de que las transacciones económicas dependen de redes de confianza y lazos sociales." },
            { q: "¿Qué autor estudia la 'Acción Social' y el método 'Verstehen'?", a: "Max Weber." },
            { q: "¿En qué se diferencia el Homo Economicus del Sociologicus?", a: "El primero es una calculadora racional aislada; el segundo actúa movido por normas, estatus y valores." },
            // U3
            { q: "¿Qué es la Socialización Primaria?", a: "Internalización de normas básicas en la familia durante la niñez." },
            { q: "¿Qué es el Etnocentrismo?", a: "Juzgar otras culturas bajo los estándares de la propia, asumiendo superioridad." },
            { q: "¿Cuál es la diferencia entre cultura material e inmaterial?", a: "Material: objetos y tecnología. Inmaterial: valores, símbolos, normas y leyes." },
            // U4
            { q: "¿Qué es la Solidaridad Mecánica (Durkheim)?", a: "Cohesión por similitud, típica de sociedades tradicionales con poca división del trabajo." },
            { q: "¿Qué es la Solidaridad Orgánica?", a: "Cohesión por interdependencia funcional, típica de sociedades modernas especializadas." },
            { q: "¿Qué caracteriza a un Grupo Primario?", a: "Relaciones afectivas, íntimas y cara a cara (ej. la familia)." },
            { q: "¿Qué es un Grupo Secundario?", a: "Relaciones formales, impersonales y utilitarias (ej. una empresa o sindicato)." },
            { q: "¿En qué consiste la Anomia?", a: "Estado de confusión o falta de normas claras que regulen la conducta social." },
            // U5
            { q: "¿Qué es la 'Agencia Humana'?", a: "La capacidad de los individuos para tomar decisiones libres frente a las presiones del entorno." },
            { q: "¿Qué significa el concepto de 'Mala Fe' en Sartre?", a: "Autoengaño para evadir la responsabilidad moral diciendo 'solo seguía órdenes' o 'el sistema me obligó'." },
            { q: "¿Qué es la Libertad Negativa?", a: "La ausencia de interferencia u obstáculos externos para actuar ('Libertad de...')." },
            { q: "¿Qué es la Libertad Positiva?", a: "La capacidad real de autodeterminación y cumplimiento de un proyecto de vida ('Libertad para...')." },
            { q: "¿Qué condición social es vital para el mercado en la U5?", a: "La Seguridad Jurídica: normas claras y aplicadas equitativamente." },
            // U6
            { q: "¿Qué es la Estratificación Social?", a: "División de la sociedad en capas jerárquicas con desigual acceso a recursos y poder." },
            { q: "¿Qué es la Movilidad Social?", a: "Capacidad de ascender o descender de clase social por mérito o educación." },
            { q: "¿Cuál es el motor del cambio para Karl Marx?", a: "La lucha de clases y el conflicto por los medios de producción." },
            { q: "¿Qué es la Modernización?", a: "Transición de sociedades tradicionales a industriales, tecnológicas y burocráticas." },
            { q: "¿Qué impacto tiene la Globalización en los mercados locales?", a: "Genera interdependencia mundial y exige mayor relativismo cultural." },
            { q: "¿Por qué surge la 'Resistencia al Cambio'?", a: "Por intereses creados (quienes se benefician del atraso) o inercia de la cultura antigua." },
            // General
            { q: "¿Qué estudia la Dinámica Social según Comte?", a: "El progreso y las leyes del cambio en la sociedad." },
            { q: "¿Qué es el Capital Social?", a: "Recursos y favores obtenidos mediante redes de contactos y confianza." },
            { q: "¿Qué autor analizó la Burocracia como forma racional?", a: "Max Weber." },
            { q: "¿Qué es una Institución Social?", a: "Pautas estables de comportamiento que regulan la vida social (ej. el Estado)." },
            { q: "¿Qué es el Relativismo Cultural?", a: "Comprender una cultura ajena desde sus propios términos, sin juzgarla." },
            { q: "¿Qué es un Hecho Social (Durkheim)?", a: "Formas de actuar externas y coercitivas al individuo." },
            { q: "¿Qué es la Socialización Secundaria?", a: "Aprendizaje de roles en instituciones específicas (ej. la universidad o el trabajo)." }
        ];

        let currentIndex = 0;
        const cardElement = document.getElementById('flashcard');
        const qText = document.getElementById('question-text');
        const aText = document.getElementById('answer-text');
        const counterText = document.getElementById('card-counter');
        const progressBar = document.getElementById('progress-bar');

        // Optional: Simple soft tick sound for interactions
        const flipSound = new Audio('data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTQAAAAA/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8=');
        flipSound.volume = 0.1;

        function flipCard() {
            cardElement.classList.toggle('flipped');
            try { flipSound.play().catch(e => {}); } catch(e) {}
        }

        function updateCard() {
            cardElement.classList.remove('flipped');
            
            // Calculate progress
            const progress = ((currentIndex + 1) / cardsData.length) * 100;
            progressBar.style.width = `${progress}%`;

            setTimeout(() => {
                qText.textContent = cardsData[currentIndex].q;
                aText.textContent = cardsData[currentIndex].a;
                counterText.textContent = `Tarjeta ${currentIndex + 1} de ${cardsData.length}`;
            }, 250); // Waited for flip animation to be mostly hidden
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % cardsData.length;
            updateCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
            updateCard();
        }

        // Add keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        // Initialize
        updateCard();
    </script>
</body>

</html>
